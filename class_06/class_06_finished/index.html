<html>
	<!-- Q: What type of content goes inside the <head>? 
    Does it show up on the webpage? -->
	<!-- A: meta information: stylesheet, title -->
	<!-- does NOT show up on webpage -->
	<head>
		<title>class 6 demo 😌</title>
		<link href="style.css" rel="stylesheet" />
		<!-- NEW: LINK JS FILE USING <script> -->
		<!-- ---------------------------------- -->
         <script src="main.js"></script>
	</head>

	<!-- Q: What type of content goes inside the <body>? 
    Does it show up on the webpage? -->
	<!-- A: text, image, buttons-->
	<!-- shows on the webpage it is the CONTENT -->
	<body>
		<p>this is a paragraph</p>
		<p class="blue">this is a second paragraph</p>
		<p id="main">this is a third paragraph</p>

		<!-- now open up style.css -->
	</body>
</html>
